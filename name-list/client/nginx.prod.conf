# Nginx config for the production client image.
# Serves the static React bundle and proxies /api to the Kubernetes api
# Service, so the browser stays on one origin (no CORS, no Ingress needed).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probe endpoint used by the Kubernetes readiness/liveness checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Express API. No trailing slash on proxy_pass: /api/names is forwarded
    # unchanged to http://api:5000/api/names.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite assets are immutable; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Any unknown path is a React route, so return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
