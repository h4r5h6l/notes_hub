services:
  db:
    image: postgres:16-alpine
    command: postgres -c log_statement=all
    environment:
      POSTGRES_USER: taskify
      POSTGRES_PASSWORD: taskify
      POSTGRES_DB: taskify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskify -d taskify"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    environment:
      PGHOST: db
      PGUSER: taskify
      PGPASSWORD: taskify
      PGDATABASE: taskify
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
 
